<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1018" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>GlideHive — Pixel Thumb Sandbox</title>
<style>
  :root {
    --bg: #0b1018;
    --surface: #131b26;
    --surface2: #1c2736;
    --border: rgba(148, 163, 184, 0.16);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-soft: rgba(56, 189, 248, 0.18);
    --heart: #f59e0b;
    --heart-soft: rgba(245, 158, 11, 0.16);
    --delete: #f43f5e;
    --delete-bg: rgba(244, 63, 94, 0.22);
    --green: #34d399;
    --purple: #c084fc;
    --bottom-lift: 14px;
    --kbd-width: 88%;
    --hex-height-scale: 1.04;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--bottom-lift));
    position: relative;
  }

  /* Header Bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 6px;
    gap: 8px;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.2px;
  }
  .brand-hex {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
    font-size: 11px;
    color: #0b1018;
    font-weight: 900;
  }
  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pill-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background 0.12s, border-color 0.12s;
  }
  .pill-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: #e0f2fe;
  }
  .pill-btn:active {
    transform: scale(0.96);
  }

  /* Practice prompt bar */
  .prompt-bar {
    margin: 0 12px 6px;
    padding: 7px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
  }
  .prompt-bar.hidden { display: none; }
  .prompt-text {
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .prompt-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--accent);
    font-weight: 700;
    display: block;
    margin-bottom: 1px;
  }

  /* Text Composer Area (Custom, prevents Gboard popup) */
  .editor-wrap {
    flex: 1;
    min-height: 76px;
    margin: 0 12px 6px;
    background: #0f1621;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px 28px;
    position: relative;
    overflow-y: auto;
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
  }
  .editor-content {
    font-size: 20px;
    line-height: 1.45;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 44px;
  }
  .editor-placeholder {
    color: #475569;
    font-size: 16px;
  }
  .cursor-caret {
    display: inline-block;
    width: 2.5px;
    height: 1.15em;
    background: var(--accent);
    vertical-align: -0.18em;
    margin: 0 0.5px;
    border-radius: 2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    0%, 55% { opacity: 1; }
    56%, 100% { opacity: 0.15; }
  }
  .editor-footer {
    position: sticky;
    bottom: -28px;
    margin-top: auto;
    padding-top: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
  }
  .stat-badge {
    background: rgba(52, 211, 153, 0.14);
    color: var(--green);
    border: 1px solid rgba(52, 211, 153, 0.25);
    border-radius: 999px;
    padding: 2px 8px;
    font-weight: 600;
    font-size: 11px;
  }
  .gesture-toast {
    background: rgba(56, 189, 248, 0.16);
    color: #bae6fd;
    border-radius: 999px;
    padding: 2px 8px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .gesture-toast.show { opacity: 1; }

  /* Tuning Overlay Drawer */
  .tune-drawer {
    position: absolute;
    top: 48px;
    left: 12px;
    right: 12px;
    z-index: 60;
    background: #141d2b;
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 16px;
    padding: 12px 14px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
    display: none;
    flex-direction: column;
    gap: 10px;
    max-height: 55dvh;
    overflow-y: auto;
    touch-action: pan-y;
  }
  .tune-drawer.open { display: flex; }
  .tune-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12.5px;
  }
  .tune-row label {
    color: #cbd5e1;
    font-weight: 600;
    flex-shrink: 0;
  }
  .tune-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 22px;
  }
  .tune-val {
    width: 44px;
    text-align: right;
    color: var(--accent);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .seg-group {
    display: flex;
    background: #0b1018;
    border-radius: 10px;
    padding: 2px;
    border: 1px solid var(--border);
  }
  .seg-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .seg-btn.active {
    background: var(--accent);
    color: #0b1018;
  }
  .tune-footer {
    display: flex;
    gap: 8px;
    padding-top: 4px;
    border-top: 1px solid var(--border);
  }
  .tune-footer button {
    flex: 1;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
  }
  .tune-footer button.primary {
    background: var(--accent);
    color: #0b1018;
    border-color: var(--accent);
  }

  /* Prediction / Suggestion Bar */
  .suggest-bar {
    height: 40px;
    flex-shrink: 0;
    margin: 0 8px 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
    touch-action: none;
  }
  .suggest-chip {
    flex: 1;
    height: 34px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 8px;
    transition: background 0.1s;
  }
  .suggest-chip.top {
    background: var(--accent-soft);
    border-color: rgba(56, 189, 248, 0.45);
    color: #e0f2fe;
  }
  .suggest-chip:active {
    transform: scale(0.96);
    background: rgba(56, 189, 248, 0.3);
  }
  .suggest-chip.empty {
    opacity: 0.35;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
  }

  /* Keyboard Shell (Handles Right/Left/Full Docking) */
  .kbd-shell {
    flex-shrink: 0;
    width: 100%;
    padding: 2px 6px 4px;
    display: flex;
    align-items: stretch;
    gap: 5px;
    touch-action: none;
    position: relative;
  }
  .kbd-shell.hand-right { flex-direction: row; }
  .kbd-shell.hand-left { flex-direction: row-reverse; }
  .kbd-shell.hand-full .side-gutter { display: none; }

  /* Side Utility Gutter */
  .side-gutter {
    width: calc(100% - var(--kbd-width));
    min-width: 44px;
    max-width: 64px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    justify-content: space-between;
    padding-bottom: 2px;
  }
  .gutter-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    touch-action: none;
  }
  .gutter-btn span {
    font-size: 9px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .gutter-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .gutter-btn:active {
    background: var(--surface2);
    transform: scale(0.95);
  }

  /* Main Keyboard Column */
  .kbd-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    touch-action: none;
  }

  /* Hex Canvas Container */
  .hex-stage {
    position: relative;
    width: 100%;
    touch-action: none;
  }
  #hexSvg {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    overflow: visible;
  }
  #trailCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  /* Floating Thumb Preview Bubble */
  .key-popup {
    position: absolute;
    z-index: 30;
    pointer-events: none;
    transform: translate(-50%, -100%);
    min-width: 54px;
    height: 54px;
    padding: 0 12px;
    border-radius: 16px;
    background: #1e293b;
    border: 2px solid var(--accent);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.65);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    font-size: 26px;
    font-weight: 800;
  }
  .key-popup.show { display: flex; }
  .key-popup.alt {
    border-color: var(--heart);
    color: #fde68a;
  }
  .key-popup small {
    font-size: 9px;
    color: var(--muted);
    font-weight: 600;
    margin-top: -2px;
  }

  /* Unified Single-Screen 123# View */
  .sym-stage {
    display: none;
    width: 100%;
    flex-direction: column;
    gap: 5px;
    touch-action: none;
  }
  .sym-stage.active { display: flex; }
  .sym-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2px;
    font-size: 11px;
    color: var(--muted);
  }
  .sym-grid {
    display: flex;
    gap: 6px;
    width: 100%;
  }
  .kbd-shell.hand-left .sym-grid {
    flex-direction: row-reverse;
  }
  .sym-groups {
    flex: 1.35;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .sym-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }
  .sym-key {
    height: 44px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
  }
  .sym-key:active { transform: scale(0.93); background: var(--surface2); }
  .sym-key.grp-punct { border-color: rgba(56, 189, 248, 0.35); color: #bae6fd; }
  .sym-key.grp-brack { border-color: rgba(192, 132, 252, 0.38); color: #e9d5ff; }
  .sym-key.grp-math  { border-color: rgba(52, 211, 153, 0.35); color: #a7f3d0; }
  .sym-key.grp-web   { border-color: rgba(245, 158, 11, 0.35); color: #fde68a; }

  .numpad-zone {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    background: rgba(56, 189, 248, 0.06);
    border: 1px solid rgba(56, 189, 248, 0.22);
    border-radius: 12px;
    padding: 4px;
  }
  .num-key {
    height: 42px;
    border-radius: 9px;
    border: 1px solid rgba(148, 163, 184, 0.2);
    background: #172233;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
  }
  .num-key.zero { background: #1e2d42; border-color: rgba(56, 189, 248, 0.4); }
  .num-key:active { transform: scale(0.93); background: var(--accent); color: #0b1018; }

  /* Bottom Action Dock (Mirrors in Left-Handed Mode) */
  .action-dock {
    display: flex;
    gap: 5px;
    height: 50px;
    touch-action: none;
  }
  .kbd-shell.hand-left .action-dock {
    flex-direction: row-reverse;
  }
  .dock-btn {
    border-radius: 13px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
    touch-action: none;
    position: relative;
    transition: background 0.1s, transform 0.08s;
  }
  .dock-btn:active { transform: scale(0.96); }

  .btn-mode { width: 56px; font-size: 13px; color: #bae6fd; background: #152233; }
  .btn-shift-full { width: 44px; font-size: 17px; display: none; }
  .kbd-shell.hand-full .btn-shift-full { display: flex; }
  .btn-shift-full.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .btn-space {
    flex: 1;
    background: #151f2e;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.4px;
  }
  .btn-space.sliding {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: #e0f2fe;
  }
  .btn-delete {
    width: 68px;
    background: var(--delete-bg);
    border-color: rgba(244, 63, 94, 0.55);
    color: #ffe4e6;
    font-size: 20px;
  }
  .btn-delete .del-hints {
    font-size: 8.5px;
    color: #fda4af;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin-top: -2px;
  }
  .btn-delete.swiping-left {
    background: rgba(244, 63, 94, 0.5);
    transform: translateX(-4px);
  }
  .btn-delete.swiping-right {
    background: rgba(245, 158, 11, 0.42);
    border-color: var(--heart);
    transform: translateX(4px);
  }
  .btn-enter {
    width: 52px;
    background: linear-gradient(135deg, #0284c7, #2563eb);
    border-color: rgba(56, 189, 248, 0.5);
    color: #fff;
    font-size: 19px;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <span class="brand-hex">E</span>
      <span>GlideHive</span>
    </div>
    <div class="top-actions">
      <button class="pill-btn active" id="btnPrompts">Prompts</button>
      <button class="pill-btn" id="btnClear">Clear</button>
      <button class="pill-btn" id="btnTune">⚙️ Tune</button>
    </div>
  </div>

  <!-- Collapsible Practice Prompt Bar -->
  <div class="prompt-bar" id="promptBar">
    <div style="min-width:0; flex:1;">
      <span class="prompt-label">Try gliding this</span>
      <div class="prompt-text" id="promptText">thanks mate see you tomorrow</div>
    </div>
    <button class="pill-btn" id="btnNextPrompt">Next ▸</button>
  </div>

  <!-- Live Ergonomic Calibration Drawer -->
  <div class="tune-drawer" id="tuneDrawer">
    <div class="tune-row">
      <label>Thumb Mode</label>
      <div class="seg-group" id="handSeg">
        <button class="seg-btn" data-hand="left">Left</button>
        <button class="seg-btn active" data-hand="right">Right</button>
        <button class="seg-btn" data-hand="full">Full</button>
      </div>
    </div>
    <div class="tune-row">
      <label>Hex Height</label>
      <input type="range" id="rngHeight" min="85" max="130" value="104" />
      <span class="tune-val" id="valHeight">104%</span>
    </div>
    <div class="tune-row">
      <label>One-Hand Width</label>
      <input type="range" id="rngWidth" min="76" max="95" value="88" />
      <span class="tune-val" id="valWidth">88%</span>
    </div>
    <div class="tune-row">
      <label>Bottom Lift</label>
      <input type="range" id="rngLift" min="0" max="48" value="14" />
      <span class="tune-val" id="valLift">14px</span>
    </div>
    <div class="tune-row">
      <label>Hold-for-Symbol</label>
      <input type="range" id="rngHold" min="150" max="380" step="10" value="230" />
      <span class="tune-val" id="valHold">230ms</span>
    </div>
    <div class="tune-row">
      <label>Heart Glow / Haptics</label>
      <div style="display:flex; gap:6px;">
        <button class="pill-btn active" id="btnHeartGlow">Heart: ON</button>
        <button class="pill-btn active" id="btnHaptics">Vibe: ON</button>
      </div>
    </div>
    <div class="tune-footer">
      <button id="btnResetTune">Reset Defaults</button>
      <button class="primary" id="btnCopyTune">Copy My Pixel Notes</button>
      <button id="btnCloseTune">Done</button>
    </div>
  </div>

  <!-- Custom Text Composer (tap to move cursor, never triggers system Gboard) -->
  <div class="editor-wrap" id="editorWrap">
    <div class="editor-content" id="editorContent"></div>
    <div class="editor-footer">
      <span class="stat-badge" id="statBadge">Glide a word across the hexes</span>
      <span class="gesture-toast" id="gestureToast"></span>
    </div>
  </div>

  <!-- Top-4 Glide Prediction Bar -->
  <div class="suggest-bar" id="suggestBar">
    <div class="suggest-chip empty">Glide or tap letters below…</div>
  </div>

  <!-- Keyboard Shell -->
  <div class="kbd-shell hand-right" id="kbdShell">
    <!-- Left/Right Utility Gutter -->
    <div class="side-gutter" id="sideGutter">
      <button class="gutter-btn" id="btnFlipHand" title="Switch Left/Right Thumb">
        ⇄<span>Hand</span>
      </button>
      <button class="gutter-btn" id="btnShiftGutter" title="Shift / Auto-Cap">
        ⇧<span>Caps</span>
      </button>
      <button class="gutter-btn" id="btnUndo" title="Undo">
        ↶<span>Undo</span>
      </button>
      <button class="gutter-btn" id="btnCopyText" title="Copy Text">
        📋<span>Copy</span>
      </button>
    </div>

    <!-- Main Keyboard Column -->
    <div class="kbd-main">
      <!-- Hexagonal Glide Stage -->
      <div class="hex-stage" id="hexStage">
        <svg id="hexSvg" preserveAspectRatio="none"></svg>
        <canvas id="trailCanvas"></canvas>
        <div class="key-popup" id="keyPopup"></div>
      </div>

      <!-- Unified Single-Screen 123# Numbers & All Symbols -->
      <div class="sym-stage" id="symStage">
        <div class="sym-header">
          <span>All numbers &amp; symbols — 1 screen</span>
          <button class="pill-btn active" id="btnAutoReturn" style="padding:2px 8px; font-size:11px;">Snap to ABC: ON</button>
        </div>
        <div class="sym-grid">
          <div class="sym-groups" id="symGroups"></div>
          <div class="numpad-zone" id="numpadZone"></div>
        </div>
      </div>

      <!-- Mirrored Bottom Action Dock -->
      <div class="action-dock" id="actionDock">
        <button class="dock-btn btn-mode" id="btnMode">123#</button>
        <button class="dock-btn btn-shift-full" id="btnShiftFull">⇧</button>
        <div class="dock-btn btn-space" id="btnSpace">
          <span id="spaceLabel">Space  ◄ slide cursor ►</span>
        </div>
        <div class="dock-btn btn-delete" id="btnDelete">

    let uLen = 0;
    for (let i = 1; i < unitPts.length; i++) {
      uLen += Math.hypot(unitPts[i][0] - unitPts[i-1][0], unitPts[i][1] - unitPts[i-1][1]);
    }

    const best = [];
    const maxEndDist = 1.55;

    for (let idx = 0; idx < TEMPLATES.length; idx++) {
      const tpl = TEMPLATES[idx];
      const ds = Math.hypot(uStart[0] - tpl.sx, uStart[1] - tpl.sy);
      if (ds > maxEndDist) continue;
      const de = Math.hypot(uEnd[0] - tpl.ex, uEnd[1] - tpl.ey);
      if (de > maxEndDist) continue;

      let pErr = 0;
      const wRes = tpl.res;
      for (let i = 0; i < N_PTS; i++) {
        pErr += Math.hypot(uRes[i*2] - wRes[i*2], uRes[i*2+1] - wRes[i*2+1]);
      }
      pErr /= N_PTS;

      // Coverage check: did the user path pass near every letter of the candidate?
      let covErr = 0;
      const raw = tpl.raw;
      for (let r = 0; r < raw.length; r++) {
        const rx = raw[r][0], ry = raw[r][1];
        let minD = 99;
        for (let i = 0; i < N_PTS; i++) {
          const d = Math.hypot(uRes[i*2] - rx, uRes[i*2+1] - ry);
          if (d < minD) minD = d;
        }
        covErr += minD;
      }
      covErr /= raw.length;

      const lErr = Math.abs(uLen - tpl.wLen) / Math.max(uLen, tpl.wLen, 1.0);
      const score = 0.55 * pErr + 0.35 * (ds + de) * 0.5 + 0.30 * covErr + 0.25 * lErr + tpl.freqPen;

      if (best.length < 4 || score < best[best.length - 1].score) {
        best.push({ w: tpl.w, score });
        best.sort((a, b) => a.score - b.score);
        if (best.length > 4) best.pop();
      }
    }
    return best.map(b => b.w);
  }

  function prefixSuggestions(prefix) {
    if (!prefix) return [];
    const low = prefix.toLowerCase();
    const out = [];
    for (let i = 0; i < DICT_WORDS.length && out.length < 4; i++) {
      if (DICT_WORDS[i].startsWith(low)) out.push(DICT_WORDS[i]);
    }
    return out;
  }

  // =========================================================================
  // 4. DOM REFERENCES & HELPERS
  // =========================================================================
  const $ = id => document.getElementById(id);
  const kbdShell = $('kbdShell');
  const hexStage = $('hexStage');
  const hexSvg = $('hexSvg');
  const trailCanvas = $('trailCanvas');
  const trailCtx = trailCanvas.getContext('2d');
  const keyPopup = $('keyPopup');
  const symStage = $('symStage');
  const editorContent = $('editorContent');
  const editorWrap = $('editorWrap');
  const suggestBar = $('suggestBar');
  const statBadge = $('statBadge');
  const gestureToast = $('gestureToast');

  function buzz(ms) {
    if (cfg.haptics && navigator.vibrate) {
      try { navigator.vibrate(ms); } catch (_) {}
    }
  }

  let toastTimer = null;
  function showToast(msg) {
    gestureToast.textContent = msg;
    gestureToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => gestureToast.classList.remove('show'), 1400);
  }

  function saveCfg() {
    try { localStorage.setItem('glidehive_cfg_v1', JSON.stringify(cfg)); } catch (_) {}
  }

  function pushUndo() {
    state.undoStack.push({ text: state.text, cursor: state.cursor });
    if (state.undoStack.length > 40) state.undoStack.shift();
  }

  function shouldAutoCap() {
    if (state.shiftMode === 'once') return true;
    if (state.shiftMode === 'off') return false;
    const before = state.text.slice(0, state.cursor);
    if (before.trim().length === 0) return true;
    return /[.!?]\s*$/.test(before) || /\n$/.test(before);
  }

  function formatWord(rawWord) {
    let w = CONTRACTIONS[rawWord] || rawWord;
    if (w === 'i') w = 'I';
    if (shouldAutoCap()) {
      w = w.charAt(0).toUpperCase() + w.slice(1);
    }
    return w;
  }

  function syncShiftButtons() {
    const active = shouldAutoCap();
    $('btnShiftGutter').classList.toggle('active', active);
    $('btnShiftFull').classList.toggle('active', active);
    // Update hex letter case visually
    hexSvg.querySelectorAll('text.hex-main').forEach(el => {
      const k = el.dataset.key;
      el.textContent = active ? k.toUpperCase() : k.toLowerCase();
    });
  }

  // =========================================================================
  // 5. TEXT RENDERING & CURSOR PLACEMENT
  // =========================================================================
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderEditor() {
    if (state.text.length === 0) {
      editorContent.innerHTML = `<span class="cursor-caret"></span><span class="editor-placeholder">Glide across hexes or tap letters…</span>`;
    } else {
      const before = escapeHtml(state.text.slice(0, state.cursor));
      const after = escapeHtml(state.text.slice(state.cursor));
      editorContent.innerHTML = `${before}<span class="cursor-caret"></span>${after}`;
    }
    editorWrap.scrollTop = editorWrap.scrollHeight;
    syncShiftButtons();
  }

  // Tap inside text composer to move cursor to end (or start if empty)
  editorWrap.addEventListener('click', () => {
    state.cursor = state.text.length;
    state.lastCommittedWord = null;
    renderEditor();
  });

  function insertText(str, isWord = false, rawWord = null) {
    pushUndo();
    let before = state.text.slice(0, state.cursor);
    const after = state.text.slice(state.cursor);

    let prefixSpace = '';
    if (isWord && before.length > 0 && !/[\s(\[{'"\/-]$/.test(before)) {
      prefixSpace = ' ';
    }
    const inserted = prefixSpace + str + (isWord ? ' ' : '');
    state.text = before + inserted + after;
    const wordStart = before.length + prefixSpace.length;
    const wordEnd = wordStart + str.length;
    state.cursor = before.length + inserted.length;

    if (isWord) {
      state.lastCommittedWord = { start: wordStart, end: wordEnd, raw: rawWord };
      if (state.shiftMode === 'once') state.shiftMode = 'auto';
    } else {
      state.lastCommittedWord = null;
      if (state.shiftMode === 'once' && /[a-zA-Z]/.test(str)) state.shiftMode = 'auto';
    }
    renderEditor();
  }

  function replaceLastWord(newRaw) {
    if (!state.lastCommittedWord) return;
    pushUndo();
    const { start, end } = state.lastCommittedWord;
    const wasCap = /^[A-Z]/.test(state.text.slice(start, end));
    let formatted = CONTRACTIONS[newRaw] || newRaw;
    if (wasCap) formatted = formatted.charAt(0).toUpperCase() + formatted.slice(1);
    state.text = state.text.slice(0, start) + formatted + state.text.slice(end);
    state.cursor = start + formatted.length + (state.text[start + formatted.length] === ' ' ? 1 : 0);
    state.lastCommittedWord = { start, end: start + formatted.length, raw: newRaw };
    buzz(8);
    renderEditor();
  }

  function getCurrentTapPrefix() {
    const before = state.text.slice(0, state.cursor);
    const m = before.match(/([a-zA-Z]+)$/);
    return m ? { word: m[1], start: before.length - m[1].length } : null;
  }

  function completeTapPrefix(rawWord) {
    const pref = getCurrentTapPrefix();
    if (!pref) { insertText(formatWord(rawWord), true, rawWord); return; }
    pushUndo();
    const wasCap = /^[A-Z]/.test(pref.word);
    let formatted = CONTRACTIONS[rawWord] || rawWord;
    if (wasCap) formatted = formatted.charAt(0).toUpperCase() + formatted.slice(1);
    state.text = state.text.slice(0, pref.start) + formatted + ' ' + state.text.slice(state.cursor);
    state.cursor = pref.start + formatted.length + 1;
    state.lastCommittedWord = { start: pref.start, end: pref.start + formatted.length, raw: rawWord };
    buzz(8);
    renderEditor();
    renderSuggestions([]);
  }

  function renderSuggestions(words, mode = 'glide') {
    state.lastPredictions = words;
    if (!words || words.length === 0) {
      suggestBar.innerHTML = `<div class="suggest-chip empty">Glide or tap letters below…</div>`;
      return;
    }
    suggestBar.innerHTML = words.map((w, i) => {
      const disp = CONTRACTIONS[w] || w;
      return `<button class="suggest-chip ${i === 0 ? 'top' : ''}" data-word="${w}" data-mode="${mode}">${disp}</button>`;
    }).join('');
    suggestBar.querySelectorAll('.suggest-chip').forEach(btn => {
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const w = btn.dataset.word;
        if (btn.dataset.mode === 'glide' && state.lastCommittedWord) {
          replaceLastWord(w);
          showToast(`Swapped → ${CONTRACTIONS[w] || w}`);
        } else {
          completeTapPrefix(w);
        }
      });
    });
  }

  function updateDistanceStats(word) {
    const gDist = wordPathDist(word, UNIT_POS);
    const qDist = wordPathDist(word, QWERTY_POS);
    if (qDist <= 0.01) return;
    state.totalWordsGlided++;
    state.totalGlideDist += gDist;
    state.totalQwertyDist += qDist;
    const savedThis = Math.round((1 - gDist / qDist) * 100);
    const savedAvg = Math.round((1 - state.totalGlideDist / state.totalQwertyDist) * 100);
    const label = savedThis >= 0
      ? `"${word}" · ${savedThis}% shorter (avg ${savedAvg}% vs QWERTY)`
      : `"${word}" · avg ${savedAvg}% shorter vs QWERTY`;
    statBadge.textContent = label;
  }

  // =========================================================================
  // 6. HEXAGONAL SVG RENDERER & GEOMETRY CALIBRATION
  // =========================================================================
  let hexW = 50, hexH = 56, padX = 2, padY = 4;

  function hexPoints(cx, cy, rx, ry) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI / 180) * (60 * i - 90);
      pts.push(`${(cx + rx * Math.cos(angle)).toFixed(1)},${(cy + ry * Math.sin(angle)).toFixed(1)}`);
    }
    return pts.join(' ');
  }

  function layoutHexes() {
    const stageW = hexStage.clientWidth;
    if (!stageW) return;
    const hScale = cfg.heightScale / 100;
    hexW = (stageW - padX * 2) / 7;
    hexH = hexW * 1.1547 * hScale;
    const rowDy = hexH * 0.75;
    const totalH = hexH + 3 * rowDy + padY * 2;

    hexStage.style.height = `${Math.round(totalH)}px`;
    hexSvg.setAttribute('viewBox', `0 0 ${stageW} ${totalH}`);

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    trailCanvas.width = Math.round(stageW * dpr);
    trailCanvas.height = Math.round(totalH * dpr);
    trailCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const rx = (hexW / 2) * 0.96;
    const ry = (hexH / 2) * 0.96;
    const isCap = shouldAutoCap();

    let svgHtml = '';
    KEYS_FLAT.forEach(item => {
      const cx = padX + (item.c + item.ux - item.c + 0.5) * hexW;
      const cy = padY + hexH / 2 + item.r * rowDy;
      item.px = cx;
      item.py = cy;

      let fill = '#16202e';
      let stroke = 'rgba(148, 163, 184, 0.20)';
      let strokeW = 1.2;
      if (cfg.heartGlow) {
        if (item.tier === 0) {
          fill = '#2a2216';
          stroke = 'rgba(245, 158, 11, 0.78)';
          strokeW = 1.8;
        } else if (item.tier === 1) {
          fill = '#182638';
          stroke = 'rgba(56, 189, 248, 0.45)';
          strokeW = 1.4;
        } else if (item.tier === 2) {
          fill = '#141e2c';
          stroke = 'rgba(148, 163, 184, 0.24)';
        } else {
          fill = '#101824';
          stroke = 'rgba(148, 163, 184, 0.14)';
        }
      }

      const altColor = /[0-9]/.test(item.alt) ? '#38bdf8' : '#f59e0b';
      const label = isCap ? item.k.toUpperCase() : item.k;
      svgHtml += `
        <g class="hex-cell" data-key="${item.k}">
          <polygon points="${hexPoints(cx, cy, rx, ry)}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}" />
          <text x="${(cx + rx * 0.34).toFixed(1)}" y="${(cy - ry * 0.32).toFixed(1)}"
                text-anchor="middle" fill="${altColor}" font-size="${Math.max(9.5, hexW * 0.21).toFixed(1)}"
                font-weight="700" opacity="0.88">${escapeHtml(item.alt)}</text>
          <text class="hex-main" data-key="${item.k}" x="${cx.toFixed(1)}" y="${(cy + hexH * 0.14).toFixed(1)}"
                text-anchor="middle" fill="${item.tier === 0 && cfg.heartGlow ? '#fde68a' : '#f8fafc'}"
                font-size="${Math.max(17, hexW * 0.40).toFixed(1)}" font-weight="800">${label}</text>
        </g>`;
    });
    hexSvg.innerHTML = svgHtml;
  }

  function nearestHex(px, py) {
    let best = KEYS_FLAT[0], bestD = Infinity;
    for (let i = 0; i < KEYS_FLAT.length; i++) {
      const it = KEYS_FLAT[i];
      const d = (it.px - px) ** 2 + (it.py - py) ** 2;
      if (d < bestD) { bestD = d; best = it; }
    }
    return best;
  }

  function pixelToUnit(px, py) {
    const rowDy = hexH * 0.75;
    const ux = (px - padX) / hexW - 0.5;
    const uy = ((py - padY - hexH / 2) / rowDy) * 0.866;
    return [ux, uy];
  }

  function highlightHex(keyChar) {
    hexSvg.querySelectorAll('.hex-cell polygon').forEach(p => {
      p.style.filter = '';
      p.style.fillOpacity = '';
    });
    if (!keyChar) return;
    const cell = hexSvg.querySelector(`.hex-cell[data-key="${keyChar}"] polygon`);
    if (cell) {
      cell.style.filter = 'brightness(1.55)';
    }
  }

  // =========================================================================
  // 7. POINTER & GLIDE TRAIL ENGINE (Real Pixel Touch)
  // =========================================================================
  let activePointerId = null;
  let trailPts = [];
  let unitTrail = [];
  let startKey = null;
  let lastKey = null;
  let totalDragPx = 0;
  let isGlide = false;
  let longPressTriggered = false;
  let longPressTimer = null;
  let fadeAnim = null;

  function drawTrail(alpha = 1) {
    const w = trailCanvas.clientWidth, h = trailCanvas.clientHeight;
    trailCtx.clearRect(0, 0, w, h);
    if (trailPts.length < 2) return;

    trailCtx.lineCap = 'round';
    trailCtx.lineJoin = 'round';

    // Outer soft glow
    trailCtx.beginPath();
    trailCtx.moveTo(trailPts[0].x, trailPts[0].y);
    for (let i = 1; i < trailPts.length; i++) {
      trailCtx.lineTo(trailPts[i].x, trailPts[i].y);
    }
    trailCtx.strokeStyle = `rgba(56, 189, 248, ${(0.28 * alpha).toFixed(2)})`;
    trailCtx.lineWidth = 14;
    trailCtx.stroke();

    // Bright tapered inner ribbon
    for (let i = 1; i < trailPts.length; i++) {
      const frac = i / trailPts.length;
      trailCtx.beginPath();
      trailCtx.moveTo(trailPts[i-1].x, trailPts[i-1].y);
      trailCtx.lineTo(trailPts[i].x, trailPts[i].y);
      trailCtx.strokeStyle = `rgba(125, 211, 252, ${((0.3 + 0.7 * frac) * alpha).toFixed(2)})`;
      trailCtx.lineWidth = 2.5 + 5.5 * frac;
      trailCtx.stroke();
    }
  }

  function fadeOutTrail() {
    let alpha = 1.0;
    cancelAnimationFrame(fadeAnim);
    function step() {
      alpha -= 0.14;
      if (alpha <= 0) {
        trailCtx.clearRect(0, 0, trailCanvas.clientWidth, trailCanvas.clientHeight);
        return;
      }
      drawTrail(alpha);
      fadeAnim = requestAnimationFrame(step);
    }
    fadeAnim = requestAnimationFrame(step);
  }

  function showPopup(hex, isAlt) {
    keyPopup.style.left = `${hex.px}px`;
    keyPopup.style.top = `${Math.max(12, hex.py - hexH * 0.55)}px`;
    const mainLbl = shouldAutoCap() ? hex.k.toUpperCase() : hex.k;
    keyPopup.innerHTML = isAlt
      ? `${escapeHtml(hex.alt)}<small>symbol</small>`
      : `${mainLbl}<small>hold → ${escapeHtml(hex.alt)}</small>`;
    keyPopup.classList.toggle('alt', isAlt);
    keyPopup.classList.add('show');
  }

  function hidePopup() {
    keyPopup.classList.remove('show');
  }

  hexStage.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return;
    e.preventDefault();
    cancelAnimationFrame(fadeAnim);
    activePointerId = e.pointerId;
    try { hexStage.setPointerCapture(e.pointerId); } catch (_) {}

    const rect = hexStage.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const hex = nearestHex(x, y);

    startKey = hex;
    lastKey = hex;
    totalDragPx = 0;
    isGlide = false;
    longPressTriggered = false;
    trailPts = [{ x, y }];
    unitTrail = [pixelToUnit(x, y)];

    highlightHex(hex.k);
    showPopup(hex, false);
    buzz(7);

    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      if (!isGlide && activePointerId !== null && startKey) {
        longPressTriggered = true;
        showPopup(startKey, true);
        buzz(15);
      }
    }, cfg.holdMs);
  });

  hexStage.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    e.preventDefault();

    const rect = hexStage.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
    const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
    const prev = trailPts[trailPts.length - 1];
    const step = Math.hypot(x - prev.x, y - prev.y);
    if (step < 2.5) return;

    totalDragPx += step;
    trailPts.push({ x, y });
    unitTrail.push(pixelToUnit(x, y));

    const hex = nearestHex(x, y);
    if (!isGlide && (totalDragPx > hexW * 0.42 || hex.k !== startKey.k)) {
      isGlide = true;
      longPressTriggered = false;
      clearTimeout(longPressTimer);
      hidePopup();
    }

    if (isGlide) {
      if (hex.k !== lastKey.k) {
        lastKey = hex;
        highlightHex(hex.k);
        buzz(4);
      }
      drawTrail(1);
    }
  });

  function finishHexPointer(e) {
    if (e.pointerId !== activePointerId) return;
    e.preventDefault();
    clearTimeout(longPressTimer);
    activePointerId = null;
    hidePopup();
    highlightHex(null);

    if (isGlide && unitTrail.length >= 2) {
      fadeOutTrail();
      const preds = decodeGlide(unitTrail);
      if (preds.length > 0) {
        const top = preds[0];
        insertText(formatWord(top), true, top);
        renderSuggestions(preds, 'glide');
        updateDistanceStats(top);
        buzz(10);
      }
    } else if (startKey) {
      trailCtx.clearRect(0, 0, trailCanvas.clientWidth, trailCanvas.clientHeight);
      if (longPressTriggered) {
        insertText(startKey.alt, false);
        renderSuggestions([]);
        showToast(`Inserted ${startKey.alt}`);
      } else {
        const ch = shouldAutoCap() ? startKey.k.toUpperCase() : startKey.k;
        insertText(ch, false);
        const pref = getCurrentTapPrefix();
        renderSuggestions(pref ? prefixSuggestions(pref.word) : [], 'prefix');
      }
    }
  }

  hexStage.addEventListener('pointerup', finishHexPointer);
  hexStage.addEventListener('pointercancel', finishHexPointer);

  // =========================================================================
  // 8. UNIFIED SINGLE-SCREEN 123# NUMBERS & SYMBOLS
  // =========================================================================
  const NUM_KEYS = ['7','8','9','4','5','6','1','2','3','0','.','='];

  function buildSymbolsView() {
    const symGroups = $('symGroups');
    const compactRows = [
      { cls: 'grp-punct', keys: ['.', ',', '?', '!', "'", '"'] },
      { cls: 'grp-brack', keys: ['(', ')', '[', ']', '{', '}'] },
      { cls: 'grp-math',  keys: ['$', '%', '+', '-', '*', '_'] },
      { cls: 'grp-web',   keys: ['@', '#', '&', '/', ':', ';'] }
    ];
    symGroups.innerHTML = compactRows.map(row => `
      <div class="sym-row" style="grid-template-columns: repeat(6, 1fr);">
        ${row.keys.map(k => `<button class="sym-key ${row.cls}" data-char="${escapeHtml(k)}">${escapeHtml(k)}</button>`).join('')}
      </div>
    `).join('');

    const numpadZone = $('numpadZone');
    numpadZone.innerHTML = NUM_KEYS.map(k =>
      `<button class="num-key ${k === '0' ? 'zero' : ''}" data-char="${k}">${k}</button>`
    ).join('');

    symStage.querySelectorAll('[data-char]').forEach(btn => {
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const ch = btn.dataset.char;
        // If punctuation right after auto-space, pull it snug to the word (just like Gboard!)
        if (/^[.,?!:;)]$/.test(ch) && state.cursor > 0 && state.text[state.cursor - 1] === ' ') {
          pushUndo();
          state.text = state.text.slice(0, state.cursor - 1) + ch + ' ' + state.text.slice(state.cursor);
          state.cursor += 1;
          state.lastCommittedWord = null;
          renderEditor();
        } else {
          insertText(ch, false);
        }
        buzz(8);
        if (cfg.autoReturnSym && !/^[0-9.]$/.test(ch)) {
          setView('hex');
        }
      });
    });
  }

  function setView(v) {
    state.view = v;
    const isSym = v === 'sym';
    hexStage.style.display = isSym ? 'none' : 'block';
    symStage.classList.toggle('active', isSym);
    $('btnMode').textContent = isSym ? 'ABC' : '123#';
    if (!isSym) requestAnimationFrame(layoutHexes);
  }

  // =========================================================================
  // 9. MULTI-GESTURE DELETE (⌫) & SPACE CURSOR TRACKPAD
  // =========================================================================
  function deleteOneChar() {
    if (state.cursor === 0) return;
    pushUndo();
    state.text = state.text.slice(0, state.cursor - 1) + state.text.slice(state.cursor);
    state.cursor--;
    state.lastCommittedWord = null;
    renderEditor();
    const pref = getCurrentTapPrefix();
    renderSuggestions(pref ? prefixSuggestions(pref.word) : [], 'prefix');
  }

  function forwardDeleteOneChar() {
    if (state.cursor >= state.text.length) return;
    pushUndo();
    state.text = state.text.slice(0, state.cursor) + state.text.slice(state.cursor + 1);
    state.lastCommittedWord = null;
    renderEditor();
    buzz(12);
    showToast('Forward deleted ⌦');
  }

  function deleteWholeWord() {
    if (state.cursor === 0) return;
    pushUndo();
    const before = state.text.slice(0, state.cursor);
    const trimmed = before.replace(/\s+$/, '');
    const cut = trimmed.replace(/\S+$/, '');
    state.text = cut + state.text.slice(state.cursor);
    state.cursor = cut.length;
    state.lastCommittedWord = null;
    renderEditor();
    renderSuggestions([]);
    buzz(18);
    showToast('Deleted word');
  }

  // Multi-gesture ⌫ handler
  const btnDelete = $('btnDelete');
  let delPtr = null, delStartX = 0, delSwiped = false, delRepeated = false, delHoldTimer = null, delRepeatTimer = null;

  btnDelete.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    delPtr = e.pointerId;
    delStartX = e.clientX;
    delSwiped = false;
    delRepeated = false;
    try { btnDelete.setPointerCapture(e.pointerId); } catch (_) {}

    delHoldTimer = setTimeout(() => {
      if (!delSwiped && delPtr !== null) {
        delRepeated = true;
        deleteOneChar();
        buzz(6);
        delRepeatTimer = setInterval(() => { deleteOneChar(); buzz(4); }, 85);
      }
    }, 360);
  });

  btnDelete.addEventListener('pointermove', (e) => {
    if (e.pointerId !== delPtr) return;
    const dx = e.clientX - delStartX;
    if (Math.abs(dx) > 12) {
      clearTimeout(delHoldTimer);
      clearInterval(delRepeatTimer);
    }
    btnDelete.classList.toggle('swiping-left', dx < -24);
    btnDelete.classList.toggle('swiping-right', dx > 24);
    if (!delSwiped && dx < -30) {
      delSwiped = 'left';
      deleteWholeWord();
    } else if (!delSwiped && dx > 30) {
      delSwiped = 'right';
      forwardDeleteOneChar();
    }
  });

  function endDelete(e) {
    if (e.pointerId !== delPtr) return;
    clearTimeout(delHoldTimer);
    clearInterval(delRepeatTimer);
    btnDelete.classList.remove('swiping-left', 'swiping-right');
    if (!delSwiped && !delRepeated) {
      deleteOneChar();
      buzz(8);
    }
    delPtr = null;
  }
  btnDelete.addEventListener('pointerup', endDelete);
  btnDelete.addEventListener('pointercancel', endDelete);

  // Space / Slide-Cursor Trackpad handler
  const btnSpace = $('btnSpace');
  const spaceLabel = $('spaceLabel');
  let spPtr = null, spStartX = 0, spLastStepX = 0, spSliding = false, lastSpaceTap = 0;

  btnSpace.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    spPtr = e.pointerId;
    spStartX = e.clientX;
    spLastStepX = e.clientX;
    spSliding = false;
    try { btnSpace.setPointerCapture(e.pointerId); } catch (_) {}
  });

  btnSpace.addEventListener('pointermove', (e) => {
    if (e.pointerId !== spPtr) return;
    if (!spSliding && Math.abs(e.clientX - spStartX) > 14) {
      spSliding = true;
      btnSpace.classList.add('sliding');
      spaceLabel.textContent = '◄ Sliding Cursor ►';
    }
    if (spSliding) {
      const diff = e.clientX - spLastStepX;
      const stepPx = 15;
      if (Math.abs(diff) >= stepPx) {
        const steps = Math.trunc(diff / stepPx);
        const nextCur = Math.max(0, Math.min(state.text.length, state.cursor + steps));
        if (nextCur !== state.cursor) {
          state.cursor = nextCur;
          state.lastCommittedWord = null;
          renderEditor();
          buzz(4);
        }
        spLastStepX += steps * stepPx;
      }
    }
  });

  function endSpace(e) {
    if (e.pointerId !== spPtr) return;
    btnSpace.classList.remove('sliding');
    spaceLabel.textContent = 'Space  ◄ slide cursor ►';
    if (!spSliding) {
      const now = Date.now();
      if (now - lastSpaceTap < 300 && state.cursor >= 2 && state.text[state.cursor - 1] === ' ' && /[a-zA-Z0-9]/.test(state.text[state.cursor - 2])) {
        pushUndo();
        state.text = state.text.slice(0, state.cursor - 1) + '. ' + state.text.slice(state.cursor);
        state.cursor += 1;
        state.lastCommittedWord = null;
        renderEditor();
        buzz(10);
      } else {
        insertText(' ', false);
        renderSuggestions([]);
        buzz(7);
      }
      lastSpaceTap = now;
    }
    spPtr = null;
  }
  btnSpace.addEventListener('pointerup', endSpace);
  btnSpace.addEventListener('pointercancel', endSpace);

  // =========================================================================
  // 10. CONTROLS, HAND-FLIPPING & LIVE TUNING
  // =========================================================================
  function applyCfg() {
    document.documentElement.style.setProperty('--bottom-lift', `${cfg.bottomLift}px`);
    document.documentElement.style.setProperty('--kbd-width', `${cfg.oneHandWidth}%`);
    document.documentElement.style.setProperty('--hex-height-scale', (cfg.heightScale / 100).toFixed(2));

    kbdShell.classList.remove('hand-right', 'hand-left', 'hand-full');
    kbdShell.classList.add(`hand-${cfg.hand}`);

    $('handSeg').querySelectorAll('.seg-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.hand === cfg.hand);
    });
    $('rngHeight').value = cfg.heightScale;
    $('valHeight').textContent = `${cfg.heightScale}%`;
    $('rngWidth').value = cfg.oneHandWidth;
    $('valWidth').textContent = `${cfg.oneHandWidth}%`;
    $('rngLift').value = cfg.bottomLift;
    $('valLift').textContent = `${cfg.bottomLift}px`;
    $('rngHold').value = cfg.holdMs;
    $('valHold').textContent = `${cfg.holdMs}ms`;
    $('btnHeartGlow').textContent = `Heart: ${cfg.heartGlow ? 'ON' : 'OFF'}`;
    $('btnHeartGlow').classList.toggle('active', cfg.heartGlow);
    $('btnHaptics').textContent = `Vibe: ${cfg.haptics ? 'ON' : 'OFF'}`;
    $('btnHaptics').classList.toggle('active', cfg.haptics);
    $('btnAutoReturn').textContent = `Snap to ABC: ${cfg.autoReturnSym ? 'ON' : 'OFF'}`;
    $('btnAutoReturn').classList.toggle('active', cfg.autoReturnSym);
    $('promptBar').classList.toggle('hidden', !cfg.showPrompts);
    $('btnPrompts').classList.toggle('active', cfg.showPrompts);

    saveCfg();
    requestAnimationFrame(layoutHexes);
  }

  $('btnMode').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    buzz(8);
    setView(state.view === 'hex' ? 'sym' : 'hex');
  });

  $('btnEnter').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    insertText('\n', false);
    renderSuggestions([]);
    buzz(10);
  });

  function toggleShift(e) {
    e.preventDefault();
    state.shiftMode = shouldAutoCap() ? 'off' : 'once';
    buzz(7);
    syncShiftButtons();
  }
  $('btnShiftGutter').addEventListener('pointerdown', toggleShift);
  $('btnShiftFull').addEventListener('pointerdown', toggleShift);

  $('btnFlipHand').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    cfg.hand = cfg.hand === 'right' ? 'left' : 'right';
    buzz(10);
    applyCfg();
    showToast(cfg.hand === 'left' ? 'Left-Thumb Dock' : 'Right-Thumb Dock');
  });

  $('btnUndo').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state.undoStack.length === 0) return;
    const prev = state.undoStack.pop();
    state.text = prev.text;
    state.cursor = prev.cursor;
    state.lastCommittedWord = null;
    buzz(9);
    renderEditor();
    showToast('Undid last action');
  });

  $('btnCopyText').addEventListener('pointerdown', async (e) => {
    e.preventDefault();
    if (!state.text) return;
    try { await navigator.clipboard.writeText(state.text); showToast('Copied text!'); }
    catch (_) { showToast('Ready to copy'); }
    buzz(10);
  });

  $('btnClear').addEventListener('click', () => {
    if (!state.text) return;
    pushUndo();
    state.text = '';
    state.cursor = 0;
    state.lastCommittedWord = null;
    renderEditor();
    renderSuggestions([]);
    buzz(10);
  });

  $('btnPrompts').addEventListener('click', () => {
    cfg.showPrompts = !cfg.showPrompts;
    applyCfg();
  });

  $('btnNextPrompt').addEventListener('click', () => {
    state.promptIdx = (state.promptIdx + 1) % PRACTICE_PROMPTS.length;
    $('promptText').textContent = PRACTICE_PROMPTS[state.promptIdx];
    buzz(6);
  });

  $('btnTune').addEventListener('click', () => {
    $('tuneDrawer').classList.toggle('open');
    $('btnTune').classList.toggle('active', $('tuneDrawer').classList.contains('open'));
  });
  $('btnCloseTune').addEventListener('click', () => {
    $('tuneDrawer').classList.remove('open');
    $('btnTune').classList.remove('active');
  });

  $('handSeg').querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => { cfg.hand = btn.dataset.hand; applyCfg(); });
  });
  $('rngHeight').addEventListener('input', e => { cfg.heightScale = +e.target.value; applyCfg(); });
  $('rngWidth').addEventListener('input', e => { cfg.oneHandWidth = +e.target.value; applyCfg(); });
  $('rngLift').addEventListener('input', e => { cfg.bottomLift = +e.target.value; applyCfg(); });
  $('rngHold').addEventListener('input', e => { cfg.holdMs = +e.target.value; applyCfg(); });

  $('btnHeartGlow').addEventListener('click', () => { cfg.heartGlow = !cfg.heartGlow; applyCfg(); });
  $('btnHaptics').addEventListener('click', () => { cfg.haptics = !cfg.haptics; applyCfg(); buzz(12); });
  $('btnAutoReturn').addEventListener('click', () => { cfg.autoReturnSym = !cfg.autoReturnSym; applyCfg(); });

  $('btnResetTune').addEventListener('click', () => {
    cfg = { ...DEFAULT_CFG };
    applyCfg();
    showToast('Defaults restored');
  });

  $('btnCopyTune').addEventListener('click', async () => {
    const avg = state.totalQwertyDist > 0
      ? `${Math.round((1 - state.totalGlideDist / state.totalQwertyDist) * 100)}%`
      : 'n/a';
    const report = `GlideHive Pixel Tuning — Hand: ${cfg.hand}, Hex Height: ${cfg.heightScale}%, One-Hand Width: ${cfg.oneHandWidth}%, Bottom Lift: ${cfg.bottomLift}px, Hold-for-Symbol: ${cfg.holdMs}ms, Heart Glow: ${cfg.heartGlow ? 'ON' : 'OFF'}, Haptics: ${cfg.haptics ? 'ON' : 'OFF'} (Words glided: ${state.totalWordsGlided}, Avg distance saved vs QWERTY: ${avg})`;
    try {
      await navigator.clipboard.writeText(report);
      showToast('Tuning notes copied!');
    } catch (_) {
      alert(report);
    }
    buzz(12);
  });

  window.addEventListener('resize', () => requestAnimationFrame(layoutHexes));

  // Boot
  buildSymbolsView();
  applyCfg();
  renderEditor();
  setTimeout(layoutHexes, 80);
})();
</script>
</body>
</html>
